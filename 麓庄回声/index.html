<html lang="zh-CN">

║  2. 想用本地图片：把图片放进本文件同目录的 assets/ 文件夹，      ║
║     写成 entry:'assets/entry.jpg'（转发时连同 assets 一起发）； ║
║  3. 人物立绘搜索「PORTRAITS = {」同理替换。                      ║

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>麓庄回声 Echoes of Lushan</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>❦</text></svg>">
<link href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Serif+SC:wght@400;600;700;900&family=Noto+Sans+SC:wght@300;400;500;700&family=Cinzel+Decorative:wght@700;900&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#ece2cb;--paper-2:#f6efdd;--paper-3:#e2d6ba;
  --ink:#2c2620;--ink-soft:#5a5040;
  --teal:#3e7068;--teal-dark:#274a45;--teal-faint:rgba(62,112,104,0.12);
  --pink:#b97a86;--pink-faint:rgba(185,122,134,0.12);
  --gold:#a8863a;--gold-light:#c8a850;--gold-dark:#6e5a24;
  --red:#98403c;
  --line:#8a7a56;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Noto Serif SC',serif;background:#111a18;color:var(--ink);overflow:hidden;height:100vh;width:100vw;user-select:none}

.ornate{position:relative;border:1px solid var(--gold-dark);box-shadow:0 6px 26px rgba(30,24,12,0.35)}
.ornate::before{content:'';position:absolute;inset:3px;border:1px solid rgba(110,90,36,0.4);pointer-events:none}
.corner{position:absolute;width:28px;height:28px;pointer-events:none;z-index:60;opacity:0.7}
.corner svg{width:100%;height:100%;fill:none;stroke:var(--gold);stroke-width:1}
.corner.tl{top:2px;left:2px}.corner.tr{top:2px;right:2px;transform:scaleX(-1)}
.corner.bl{bottom:2px;left:2px;transform:scaleY(-1)}.corner.br{bottom:2px;right:2px;transform:scale(-1,-1)}

/* 开始界面 */
#start-screen{position:fixed;inset:0;z-index:1000;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;background:#241c14}
#start-bg{position:absolute;inset:0;background-size:cover;background-position:center;opacity:0.92}
#start-bg::after{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 35%,rgba(20,16,8,0.55) 95%)}
#title-wrap{position:relative;z-index:3;text-align:center;animation:tIn 2.5s ease-out}
#start-title{font-size:68px;font-weight:900;color:#f3ead2;letter-spacing:16px;text-shadow:0 2px 6px rgba(0,0,0,0.7),0 0 44px rgba(200,168,80,0.45);position:relative;display:inline-block;padding:0 44px}
#start-title::before,#start-title::after{content:'❦';position:absolute;top:50%;transform:translateY(-50%);font-size:25px;color:var(--gold-light);opacity:0.85}
#start-title::before{left:0}#start-title::after{right:0}
#start-gothic{font-family:'Cinzel Decorative',serif;font-size:21px;color:var(--gold-light);letter-spacing:8px;margin-top:8px;text-shadow:0 2px 8px rgba(0,0,0,0.7)}
@keyframes tIn{0%{opacity:0;transform:translateY(20px);letter-spacing:34px}100%{opacity:1;transform:translateY(0)}}
#start-btn{margin-top:46px;padding:14px 54px;background:linear-gradient(180deg,rgba(200,168,80,0.25),rgba(30,24,12,0.9));color:#f3ead2;border:2px solid var(--gold-light);font-family:'Noto Serif SC';font-size:18px;letter-spacing:6px;cursor:pointer;z-index:3;position:relative;transition:all .3s;animation:tIn 2.5s ease-out 1s both;box-shadow:0 0 30px rgba(200,168,80,0.25)}
#start-btn:hover{background:var(--gold-light);color:#241c14;transform:scale(1.04)}
#white-flash{position:fixed;inset:0;background:#fff;z-index:2000;opacity:0;pointer-events:none;transition:opacity .2s}
#white-flash.flash{opacity:1;transition:opacity .05s}
#start-hint{position:absolute;bottom:20px;z-index:3;font-size:11px;color:#d8ccb0;letter-spacing:2px;animation:tIn 2.5s ease-out 1.5s both}

/* 游戏 */
#game{position:relative;width:100vw;height:100vh;display:none;flex-direction:column;background:var(--paper)}
#top-bar{height:46px;flex-shrink:0;background:linear-gradient(180deg,#f8f1de,#e8ddc2);border-bottom:1px solid var(--gold-dark);display:flex;align-items:center;padding:0 10px;z-index:120;position:relative}
#game-title{font-size:15px;font-weight:700;color:var(--teal-dark);letter-spacing:3px;margin-right:auto}
.func-btn{height:32px;padding:0 10px;background:transparent;border:1px solid var(--line);color:var(--teal-dark);cursor:pointer;margin-left:4px;display:flex;align-items:center;justify-content:center;transition:all .2s;border-radius:2px;font-family:'Noto Sans SC';font-size:11px;gap:4px}
.func-btn svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.8}
.func-btn:hover{background:var(--teal-faint);border-color:var(--teal);color:var(--teal)}
.func-btn.active{background:var(--teal);color:#f6efdd;border-color:var(--teal-dark)}

#main-area{flex:1;display:flex;position:relative;overflow:hidden}
#scene-bg{position:absolute;inset:0;background-size:cover;background-position:center;animation:kenBurns 36s ease-in-out infinite alternate}
@keyframes kenBurns{0%{transform:scale(1) translate(0,0)}100%{transform:scale(1.06) translate(-1%,-1%)}}
#scene-bg::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(20,28,24,0.02) 0%,rgba(20,28,24,0.38) 100%)}

.hotspot{position:absolute;z-index:5;cursor:pointer;display:flex;align-items:center;justify-content:center}
.hotspot .dot{width:13px;height:13px;background:var(--gold-light);border-radius:50%;box-shadow:0 0 10px rgba(200,168,80,0.9);animation:pulse 2s ease-in-out infinite;border:2px solid #f8efda}
@keyframes pulse{0%,100%{transform:scale(1);opacity:0.7}50%{transform:scale(1.35);opacity:1}}
.hotspot-label{position:absolute;bottom:19px;left:50%;transform:translateX(-50%);background:rgba(30,44,40,0.94);color:#f0e6cc;padding:3px 10px;font-size:11px;white-space:nowrap;border:1px solid var(--gold);opacity:0;transition:opacity .2s;pointer-events:none;font-family:'Noto Sans SC'}
.hotspot:hover .hotspot-label{opacity:1}
#char-panel{position:absolute;right:40px;bottom:148px;width:128px;z-index:80;display:none;text-align:center}
#char-panel img{width:120px;height:158px;object-fit:cover;border:1px solid var(--gold-dark);background:var(--paper-2);display:block}
#char-panel .ct{font-size:10px;color:var(--teal-dark);background:rgba(246,239,221,0.92);border:1px solid var(--gold);border-top:none;padding:3px;font-family:'Noto Sans SC'}

/* 边缘抽拉标签条 */
.edge-tabs{position:fixed;z-index:110;display:flex}
.edge-tabs.left{left:0;top:50%;transform:translateY(-50%);flex-direction:column}
.edge-tabs.right{right:0;top:50%;transform:translateY(-50%);flex-direction:column}
.edge-tabs.bottom{bottom:0;flex-direction:row}
.etab{background:linear-gradient(180deg,#f6efdd,#e4d8b8);border:1px solid var(--gold-dark);color:var(--teal-dark);font-family:'Noto Sans SC';font-size:11px;cursor:pointer;transition:all .2s;display:flex;align-items:center;justify-content:center;letter-spacing:2px}
.edge-tabs.left .etab,.edge-tabs.right .etab{writing-mode:vertical-rl;width:24px;height:74px;padding:6px 2px}
.edge-tabs.bottom .etab{height:24px;padding:2px 12px}
.etab:hover{background:var(--gold-light);color:#2a2010}
.etab.active{background:var(--teal);color:#f6efdd;border-color:var(--teal-dark)}

/* 抽屉面板 */
.drawer{position:fixed;z-index:105;background:linear-gradient(180deg,#f8f1de,#ecdfc0);border:1px solid var(--gold-dark);box-shadow:0 8px 30px rgba(26,20,10,0.4);transition:transform .38s cubic-bezier(.3,.8,.3,1);display:flex;flex-direction:column;overflow:hidden}
.drawer.left{left:0;top:46px;bottom:0;width:218px;transform:translateX(-102%)}
.drawer.right{right:0;top:46px;bottom:0;width:268px;transform:translateX(102%)}
.drawer.bottom{left:50%;bottom:0;transform:translate(-50%,110%)}
.drawer.open.left,.drawer.open.right{transform:translateX(0)}
.drawer.open.bottom{transform:translate(-50%,0)}
.drawer-head{padding:8px 12px;font-size:12px;letter-spacing:3px;color:var(--teal-dark);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;flex-shrink:0;background:rgba(168,134,58,0.1)}
.drawer-head .x{border:none;background:transparent;color:var(--ink-soft);cursor:pointer;font-size:13px}
.drawer-body{padding:10px 12px;overflow-y:auto;flex:1}
#d-timeline.bottom{width:min(760px,90vw)}
#d-bag.bottom{width:min(620px,88vw)}

/* 导航 */
.floor-mini{display:flex;gap:4px;margin-bottom:8px}
.floor-mini button{flex:1;padding:4px 2px;font-family:'Noto Sans SC';font-size:10px;border:1px solid var(--line);background:transparent;color:var(--ink-soft);cursor:pointer}
.floor-mini button.cur{background:var(--teal);color:#f6efdd;border-color:var(--teal-dark)}
.nav-btn{width:100%;padding:5px 9px;margin-bottom:2px;background:transparent;border:1px solid rgba(138,122,86,0.5);color:var(--ink);font-family:'Noto Sans SC';font-size:11px;cursor:pointer;text-align:left;transition:all .15s}
.nav-btn:hover{background:var(--teal-faint);color:var(--teal-dark)}
.nav-btn.cur{background:var(--teal);color:#f6efdd;border-color:var(--teal-dark)}
.nav-btn.lock{opacity:0.35;cursor:not-allowed}
.nav-grp{font-size:9px;color:var(--gold-dark);letter-spacing:2px;padding:6px 2px 2px}

/* 任务 */
.task-item{font-size:11px;color:var(--ink-soft);padding:3px 0;line-height:1.5;font-family:'Noto Sans SC'}
.task-item.done{color:var(--teal);text-decoration:line-through;opacity:0.75}
.task-item.act{color:var(--ink)}

/* 物证&人物 */
.grid{display:flex;flex-wrap:wrap;gap:7px}
.evi{width:74px;background:var(--paper-3);border:1px solid var(--line);padding:6px 4px;text-align:center}
.evi .ei{width:40px;height:40px;margin:0 auto 3px;background:var(--paper-2);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:17px;color:var(--gold-dark)}
.evi .en{font-size:9px;color:var(--ink);font-family:'Noto Sans SC'}
.evi.lock{opacity:0.3}
.charc{width:104px;background:var(--paper-3);border:1px solid var(--line);padding:6px;text-align:center;cursor:pointer}
.charc img{width:100%;height:128px;object-fit:cover;margin-bottom:4px}
.charc.unknown img{filter:grayscale(1) brightness(0.4)}
.charc .cn{font-size:11px;color:var(--teal-dark)}
.charc .cr{font-size:9px;color:var(--ink-soft);font-family:'Noto Sans SC';margin-top:2px}
.auto-note{background:var(--teal-faint);border-left:2px solid var(--teal);padding:5px 8px;margin:4px 0;font-size:11px;color:var(--ink);font-family:'Noto Sans SC';line-height:1.5}
.auto-note.cf{border-left-color:var(--red);background:rgba(152,64,60,0.08)}
#notes-area{width:100%;height:130px;background:var(--paper-2);border:1px solid var(--line);color:var(--ink);padding:8px;font-family:'Noto Serif SC';font-size:12px;line-height:1.6}

/* 道具栏 */
.bag-grid{display:flex;flex-wrap:wrap;gap:6px;padding:8px 10px 10px;justify-content:center}
.bag-slot{width:54px;height:54px;background:var(--paper-2);border:1px solid var(--line);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:20px;color:var(--gold-dark);position:relative;transition:all .2s}
.bag-slot:hover{border-color:var(--teal);box-shadow:0 0 7px rgba(62,112,104,0.3)}
.bag-slot .tip{position:absolute;bottom:58px;left:50%;transform:translateX(-50%);background:#2a3a36;color:#f0e6cc;padding:3px 8px;font-size:9px;white-space:nowrap;border:1px solid var(--gold);opacity:0;pointer-events:none;font-family:'Noto Sans SC';z-index:20}
.bag-slot:hover .tip{opacity:1}
.bag-empty{font-size:10px;color:var(--ink-soft);font-family:'Noto Sans SC';padding:14px 0}

/* 时间轴 */
.tl-strip{display:flex;gap:3px;padding:8px 10px;overflow-x:auto}
.tl-node{min-width:58px;height:40px;padding:2px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;border:1px solid var(--line)}
.tl-node .t{font-size:8px;color:var(--ink-soft)}
.tl-node .n{font-size:9px;color:var(--ink);font-family:'Noto Sans SC'}
.tl-node.unl{background:var(--teal-faint);border-color:var(--teal)}
.tl-node.unl .n{color:var(--teal-dark)}
.tl-node.cur{background:var(--gold-light);border-color:var(--gold-dark)}
.tl-node.lck{opacity:0.3;cursor:not-allowed}

/* 对话框 */
#dialog-box{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);width:min(700px,84%);min-height:126px;background:linear-gradient(180deg,rgba(248,241,222,0.97),rgba(232,220,190,0.97));border:2px solid var(--gold-dark);z-index:90;box-shadow:0 4px 20px rgba(0,0,0,0.45);display:flex;flex-direction:column}
#dialog-box::before{content:'';position:absolute;inset:3px;border:1px solid rgba(110,90,36,0.35);pointer-events:none}
#dialog-box.collapsed{height:26px;min-height:26px;overflow:hidden;cursor:pointer}
#dialog-box.collapsed .dscroll,#dialog-box.collapsed .dnext{display:none}
#dialog-tools{position:absolute;top:-1px;right:6px;display:flex;gap:2px;z-index:5}
#dialog-tools button{width:20px;height:16px;background:var(--gold-dark);color:var(--paper-2);border:none;cursor:pointer;font-size:9px}
#dialog-speaker{font-size:12px;color:var(--teal-dark);letter-spacing:1px;border-bottom:1px solid rgba(110,90,36,0.3);padding:4px 16px;flex-shrink:0;font-family:'Noto Sans SC'}
.dscroll{flex:1;overflow:hidden;position:relative;cursor:grab;padding:6px 16px}
.dscroll.dragging{cursor:grabbing}
#dialog-text{font-size:13px;line-height:1.55;color:var(--ink);white-space:pre-wrap;transition:transform .1s}
#dialog-text .cur{display:inline-block;width:6px;height:12px;background:var(--ink);animation:blink .7s infinite;vertical-align:middle}
@keyframes blink{50%{opacity:0}}
.dnext{position:absolute;bottom:2px;right:10px;font-size:9px;color:var(--gold-dark);animation:blink 1s infinite;font-family:'Noto Sans SC'}

#choice-box{position:absolute;bottom:140px;left:50%;transform:translateX(-50%);z-index:95;display:flex;flex-direction:column;gap:6px;width:min(520px,80%)}
.choice{background:rgba(30,44,40,0.95);border:1px solid var(--gold);color:#f0e6cc;padding:8px 14px;font-family:'Noto Sans SC';font-size:12px;cursor:pointer;transition:all .2s;text-align:left}
.choice:hover{background:rgba(62,112,104,0.9)}
.choice.lock{opacity:0.35;cursor:not-allowed}

/* 中央弹窗（地图/拼图/锁/卡片/设置/帮助） */
#overlay{position:fixed;inset:0;z-index:500;background:rgba(24,20,12,0.62);display:none;align-items:center;justify-content:center}
.panel{background:linear-gradient(180deg,#f8f1de,#ecdfc0);border:2px solid var(--gold);width:min(700px,94vw);max-height:86vh;padding:18px;position:relative;box-shadow:0 0 40px rgba(110,90,36,0.25);overflow-y:auto;animation:pIn .35s ease-out}
.panel.wide{width:min(960px,97vw)}
@keyframes pIn{0%{opacity:0;transform:translateY(26px) scale(.97)}100%{opacity:1;transform:none}}
.panel h3{font-size:18px;color:var(--teal-dark);text-align:center;letter-spacing:5px;border-bottom:1px solid var(--line);padding-bottom:8px;margin-bottom:12px}
.pclose{position:absolute;top:9px;right:9px;width:26px;height:26px;background:var(--red);color:#fff;border:none;cursor:pointer;font-size:12px}
.help-text{font-size:12px;line-height:1.8;color:var(--ink);font-family:'Noto Sans SC'}
.help-text h4{color:var(--teal-dark);margin:8px 0 3px;font-size:13px}
.set-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid rgba(110,90,36,0.2)}
.set-row label{font-size:12px;color:var(--ink);font-family:'Noto Sans SC';flex-shrink:0}
.set-row input[type=range]{flex:1}
.set-row select{flex:1;padding:4px;font-family:'Noto Sans SC';font-size:11px;background:var(--paper-2);border:1px solid var(--line)}
.set-val{font-size:10px;color:var(--ink-soft);font-family:'Noto Sans SC';min-width:46px;text-align:right}

/* 地图 */
.map-tabs{display:flex;gap:6px;justify-content:center;margin-bottom:10px;flex-wrap:wrap}
.map-tab{padding:5px 14px;background:transparent;border:1px solid var(--line);color:var(--ink-soft);font-family:'Noto Sans SC';font-size:11px;cursor:pointer}
.map-tab.active{background:var(--teal);border-color:var(--teal-dark);color:#f6efdd}
.floor-wrap{background:var(--paper-3);border:1px solid var(--line);padding:8px}
.floor-svg{width:100%;display:block}
.floor-svg .rm{fill:rgba(246,239,221,0.9);stroke:var(--line);stroke-width:1.5;cursor:pointer}
.floor-svg .rm:hover{fill:var(--gold-light);stroke:var(--gold-dark)}
.floor-svg .rm.locked{fill:#d8cdb2;stroke:#b0a484;cursor:not-allowed}
.floor-svg .rm.here{stroke:var(--teal-dark);stroke-width:2.5;fill:rgba(62,112,104,0.22)}
.floor-svg .rm.exterior{fill:rgba(62,112,104,0.1);stroke-dasharray:5 3}
.floor-svg text{fill:var(--ink);font-family:'Noto Sans SC';pointer-events:none;text-anchor:middle}
.floor-svg .rn{font-size:12px;font-weight:500}
.floor-svg .rs{font-size:9px;fill:var(--ink-soft)}
.floor-svg .corridor{fill:rgba(168,134,58,0.1);stroke:none}
.map-zoom-btn{margin:8px auto 0;display:block;padding:5px 18px;background:transparent;border:1px solid var(--teal);color:var(--teal-dark);font-family:'Noto Sans SC';font-size:11px;cursor:pointer}
#map-zoom{position:fixed;inset:0;z-index:900;background:rgba(20,16,8,0.97);display:none;overflow:hidden}
#map-zoom .zwrap{position:absolute;inset:0;cursor:grab}
#map-zoom .zwrap.dragging{cursor:grabbing}
#map-zoom svg{position:absolute;left:50%;top:50%;width:1900px;height:auto}
#zoom-close{position:absolute;top:14px;right:14px;z-index:10;width:30px;height:30px;background:var(--red);color:#fff;border:none;cursor:pointer;font-size:14px}
#zoom-hint{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);z-index:10;color:#c8bc98;font-size:11px;font-family:'Noto Sans SC';white-space:nowrap}

/* 拼图 */
.jig-wrap{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
.jig-target{display:grid;gap:0;background:var(--paper-3);border:2px solid var(--gold-dark);padding:0}
.jig-cell{border:1px dashed rgba(110,90,36,0.4);position:relative}
.jig-tray{flex:1;min-width:230px;min-height:200px;background:var(--paper-3);border:1px solid var(--line);position:relative;padding:6px}
.jig-piece{position:absolute;width:var(--pw);height:var(--ph);background-repeat:no-repeat;cursor:grab;box-shadow:0 2px 6px rgba(0,0,0,0.35);border:1px solid rgba(255,250,235,0.6)}
.jig-piece.dragging{cursor:grabbing;z-index:30;opacity:0.9}
.jig-piece.snapped{position:absolute;left:0;top:0;box-shadow:none;border:none;pointer-events:none}
.jig-cell.filled{border:none}
.jig-info{font-size:10px;color:var(--ink-soft);font-family:'Noto Sans SC';text-align:center;margin-top:6px}

/* 开锁 */
.lock-box{width:300px;margin:0 auto;text-align:center}
.lock-face{width:150px;height:150px;margin:8px auto;border-radius:50%;background:radial-gradient(circle,#e8ddc0,#cdbd96);border:3px solid var(--gold-dark);position:relative}
.lock-keyhole{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);width:22px;height:34px;background:var(--ink);border-radius:8px 8px 3px 3px}
.tumbler{margin:10px 0}
.tumbler .tl{font-size:10px;font-family:'Noto Sans SC';color:var(--ink-soft);display:flex;justify-content:space-between}
.tumbler input[type=range]{width:100%}
.lock-go{margin-top:10px;padding:9px 26px;background:var(--teal);color:#f6efdd;border:1px solid var(--teal-dark);font-family:'Noto Serif SC';font-size:13px;letter-spacing:3px;cursor:pointer}
.lock-go:disabled{opacity:0.35;cursor:not-allowed}

/* 拾取卡片 */
.pick-card{width:260px;margin:0 auto;text-align:center;background:var(--paper-2);border:1px solid var(--gold-dark);padding:16px}
.pick-ic{font-size:40px;color:var(--gold-dark);margin-bottom:6px}
.pick-nm{font-size:14px;color:var(--teal-dark);letter-spacing:2px}
.pick-ds{font-size:10px;color:var(--ink-soft);font-family:'Noto Sans SC';margin:6px 0 12px}
.pick-go{padding:7px 22px;background:var(--gold-light);border:1px solid var(--gold-dark);font-family:'Noto Serif SC';font-size:12px;letter-spacing:3px;cursor:pointer}

/* CV */
#cv-screen{position:fixed;inset:0;z-index:800;background:#000;display:none;overflow:hidden}
#cv-img{position:absolute;inset:0;background-size:cover;background-position:center;animation:cvKB 9s ease-in-out infinite alternate}
@keyframes cvKB{0%{transform:scale(1.05);filter:brightness(0.72)}50%{transform:scale(1.13) translateX(-1.5%);filter:brightness(0.85)}100%{transform:scale(1.1) translateX(1.5%);filter:brightness(0.72)}}
#cv-vignette{position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 35%,rgba(0,0,0,0.65) 95%)}
#cv-text{position:absolute;bottom:12%;left:50%;transform:translateX(-50%);color:#f2e9d2;font-size:17px;text-align:center;line-height:2.2;max-width:720px;text-shadow:0 2px 10px rgba(0,0,0,0.95);z-index:5;padding:0 30px}
#cv-skip{position:absolute;bottom:25px;right:25px;color:#b8ac90;font-size:11px;cursor:pointer;font-family:'Noto Sans SC';z-index:5;animation:blink 1.5s infinite}
#cv-chapter{position:absolute;top:8%;left:50%;transform:translateX(-50%);font-family:'Cinzel Decorative';font-size:14px;color:var(--gold-light);letter-spacing:6px;z-index:5;opacity:0.9}
.cv-replay{width:140px;padding:8px;background:var(--paper-3);border:1px solid var(--line);color:var(--ink);font-family:'Noto Sans SC';font-size:11px;cursor:pointer;text-align:center}
.cv-replay:hover{border-color:var(--teal);color:var(--teal-dark)}
.cv-replay.lock{opacity:0.3;cursor:not-allowed}

#toast{position:fixed;top:54px;left:50%;transform:translateX(-50%);background:#2a3a36;border:1px solid var(--gold-light);color:#f0e6cc;padding:7px 18px;font-size:12px;z-index:600;opacity:0;transition:opacity .3s;font-family:'Noto Sans SC'}
#toast.show{opacity:1}
#fade{position:fixed;inset:0;background:#000;z-index:700;opacity:0;pointer-events:none;transition:opacity .5s}
#fade.active{opacity:1;pointer-events:all}
/* ===== v12 新增样式 ===== */
/* 背包浮窗 */
#bag-float{position:fixed;right:36px;bottom:150px;width:248px;z-index:96;background:linear-gradient(180deg,#f8f1de,#ecdfc0);border:1px solid var(--gold-dark);box-shadow:0 8px 26px rgba(26,20,10,0.4);display:flex;flex-direction:column}
#bag-float.collapsed{width:128px}
#bag-float.collapsed #bag-body{display:none}
.bfloat-head{padding:6px 10px;font-size:11px;letter-spacing:3px;color:var(--teal-dark);background:rgba(168,134,58,0.12);border-bottom:1px solid var(--line);cursor:grab;display:flex;justify-content:space-between;align-items:center}
.bfloat-head.dragging{cursor:grabbing}
.bf-tools button{border:none;background:transparent;color:var(--ink-soft);cursor:pointer;font-size:11px;padding:0 2px}
#bag-body .bag-grid{display:flex;flex-wrap:wrap;gap:5px;padding:8px;justify-content:center}
#bag-body .bag-slot{width:50px;height:50px;background:var(--paper-2);border:1px solid var(--line);cursor:pointer;display:flex;align-items:center;justify-content:center;position:relative}
#bag-body .bag-slot img{width:100%;height:100%;object-fit:cover}
#bag-body .bag-slot .tip{position:absolute;bottom:54px;left:50%;transform:translateX(-50%);background:#2a3a36;color:#f0e6cc;padding:3px 7px;font-size:9px;white-space:nowrap;border:1px solid var(--gold);opacity:0;pointer-events:none;font-family:'Noto Sans SC';z-index:20}
#bag-body .bag-slot:hover .tip{opacity:1}
#bag-body .bag-empty{font-size:10px;color:var(--ink-soft);font-family:'Noto Sans SC';padding:14px 6px;text-align:center}

/* 左侧时间轴竖排 */
#timeline-strip{padding:8px 10px;display:flex;flex-direction:column;gap:3px}
.tl-vnode{display:flex;align-items:flex-start;gap:7px;padding:3px 2px;cursor:pointer;position:relative}
.tl-vnode .vdot{width:9px;height:9px;border-radius:50%;background:var(--line);margin-top:4px;flex-shrink:0}
.tl-vnode.unl .vdot{background:var(--teal)}
.tl-vnode.cur .vdot{background:var(--gold-light);box-shadow:0 0 6px var(--gold-light)}
.tl-vnode .vt{font-size:8px;color:var(--ink-soft);font-family:'Noto Sans SC'}
.tl-vnode .vn{font-size:10px;color:var(--ink)}
.tl-vnode.lck{opacity:0.35;cursor:not-allowed}
.tl-vnode:not(:last-child)::before{content:'';position:absolute;left:6px;top:16px;bottom:-3px;width:1px;background:var(--line)}

/* 任务思维导图 */
#task-body{padding:6px 8px}
.tm-branch{font-size:10px;letter-spacing:2px;color:var(--gold-dark);padding:8px 0 2px 4px;font-family:'Noto Sans SC'}
.tm-node{position:relative;padding:5px 7px 5px 16px;margin-left:8px;border-left:1px solid var(--line)}
.tm-node::before{content:'';position:absolute;left:-4px;top:12px;width:7px;height:7px;border-radius:50%;background:var(--line)}
.tm-node.done::before{background:var(--teal)}
.tm-node.act::before{background:var(--gold-light);box-shadow:0 0 5px var(--gold-light)}
.tm-node .nm{font-size:11px;color:var(--ink);line-height:1.4}
.tm-node.done .nm{color:var(--teal);text-decoration:line-through}
.tm-node .meta{font-size:9px;color:var(--ink-soft);font-family:'Noto Sans SC';line-height:1.5;margin-top:2px}
.tm-node .meta b{color:var(--pink);font-weight:400}

/* 物证可点击 */
.evi{cursor:pointer}
/* 物品详情弹窗 */
.item-detail{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-start}
.item-detail img{width:200px;height:200px;object-fit:cover;border:1px solid var(--gold-dark)}
.item-detail .it-txt{flex:1;min-width:240px;font-size:12px;line-height:1.8;white-space:pre-wrap}
.item-detail h4{color:var(--teal-dark);font-size:15px;letter-spacing:2px;margin-bottom:6px}

/* 拼图 v12 */
.jig2-wrap{display:flex;flex-direction:column;align-items:center;gap:10px}
.jig2-target{display:grid;position:relative;background:var(--paper-3);border:2px solid var(--gold-dark)}
.jig2-cell{position:relative;border:1px dashed rgba(110,90,36,0.35)}
.jig2-cell.ghost::after{content:'';position:absolute;inset:0;background-size:cover}
.jig2-piece{position:absolute;cursor:grab;box-shadow:0 2px 7px rgba(0,0,0,0.4);border:1px solid rgba(255,250,235,0.55);background-repeat:no-repeat}
.jig2-piece.dragging{cursor:grabbing;z-index:40}
.jig2-piece.snapped{box-shadow:none;border:none;pointer-events:none}
.jig2-tray{width:100%;min-height:118px;background:var(--paper-3);border:1px solid var(--line);position:relative;padding:6px}
.jig2-tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:center}
.jig2-tools button,.jig2-tools label{padding:5px 12px;background:transparent;border:1px solid var(--teal);color:var(--teal-dark);font-family:'Noto Sans SC';font-size:10px;cursor:pointer}
.jig2-tools .prog{font-size:10px;color:var(--ink-soft);font-family:'Noto Sans SC'}
#jig2-preview{position:absolute;inset:0;background:rgba(20,16,8,0.82);display:none;align-items:center;justify-content:center;z-index:50}
#jig2-preview img{max-width:92%;max-height:92%;border:1px solid var(--gold-light)}
.jig-done{text-align:center}
.jig-done img{width:min(560px,94%);border:1px solid var(--gold-dark);margin:8px 0}
.jig-done .unlock-t{color:var(--teal-dark);letter-spacing:3px;font-size:13px;margin:6px 0}

/* Simon 音序 */
.simon-box{width:300px;margin:0 auto;text-align:center}
.simon-pads{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:220px;height:220px;margin:10px auto}
.simon-pad{border:2px solid var(--gold-dark);cursor:pointer;opacity:0.55;transition:opacity .12s}
.simon-pad.lit{opacity:1;box-shadow:0 0 22px rgba(200,168,80,0.7)}
.simon-go{padding:7px 22px;background:var(--teal);color:#f6efdd;border:1px solid var(--teal-dark);font-family:'Noto Serif SC';font-size:12px;letter-spacing:2px;cursor:pointer}
.simon-info{font-size:10px;color:var(--ink-soft);font-family:'Noto Sans SC'}

/* 符号转盘 */
.dial-box{display:flex;gap:14px;justify-content:center;margin:14px 0}
.dial{width:74px;text-align:center}
.dial .wheel{width:64px;height:64px;margin:0 auto 4px;border-radius:50%;background:radial-gradient(circle,#f0e6cc,#cdbd96);border:2px solid var(--gold-dark);display:flex;align-items:center;justify-content:center;font-size:22px;color:var(--teal-dark);cursor:pointer}
.dial button{width:26px;border:1px solid var(--line);background:var(--paper-2);cursor:pointer;font-size:10px;padding:2px}
.dial-go{display:block;margin:8px auto;padding:7px 22px;background:var(--teal);color:#f6efdd;border:1px solid var(--teal-dark);font-family:'Noto Serif SC';font-size:12px;letter-spacing:2px;cursor:pointer}
.dial-go:disabled{opacity:0.35;cursor:not-allowed}

/* 接线 */
.wire-box{width:340px;margin:0 auto}
.wire-svg{width:100%;height:260px}
.wire-node{cursor:pointer;fill:var(--paper-2);stroke:var(--gold-dark);stroke-width:2}
.wire-node.sel{fill:var(--gold-light)}
.wire-node.done{fill:var(--teal)}
.wire-lab{font-size:11px;fill:var(--ink);text-anchor:middle;font-family:'Noto Sans SC';pointer-events:none}
.wire-path{fill:none;stroke:var(--teal);stroke-width:2}

/* 特写CV */
#closeup{position:fixed;inset:0;z-index:850;display:none;background:#000;overflow:hidden}
#closeup .cu-img{position:absolute;inset:0;background-size:cover;background-position:center;animation:cuZoom 5s ease-in-out infinite alternate}
@keyframes cuZoom{0%{transform:scale(1.15)}100%{transform:scale(1.3)}}
#closeup .cu-vig{position:absolute;inset:0;background:radial-gradient(ellipse at center,rgba(0,0,0,0.2),rgba(0,0,0,0.85))}
#closeup .cu-txt{position:absolute;bottom:14%;left:50%;transform:translateX(-50%);color:#f2e9d2;font-size:15px;text-align:center;line-height:2;text-shadow:0 2px 10px #000;max-width:700px;z-index:4;padding:0 30px}
#closeup .cu-skip{position:absolute;bottom:22px;right:24px;color:#b8ac90;font-size:10px;font-family:'Noto Sans SC';animation:blink 1.4s infinite;z-index:4}
#closeup.shake{animation:shake .5s linear infinite}
@keyframes shake{0%{transform:translate(0)}25%{transform:translate(-4px,2px)}50%{transform:translate(3px,-3px)}75%{transform:translate(-2px,3px)}100%{transform:translate(0)}}

::-webkit-scrollbar{width:0;display:none}
</style>
</head>

  'LETTER':{name:'匿名来信',text:`素白信封，无署名，无邮戳，纸面沾着山雾的潮气。

信上字迹工整：

「山里的房子空置一年了。从前来静养的人，都是为了避心安身。旧事未尽，旧物还在。你若记得，可回来看一次。」

没有落款。`,note:'匿名信引你重返麓庄。',pickup:'letter'},

  'ARCHIVE':{name:'铁盒档案',jigsaw:{img:'study',c:3,r:2},
    text:`黑色铁盒没有上锁。里面分层放着图纸和装订档案。

最底层是三年前的工程改造图：地下暗渠、负压风道、次声波阵列、药剂循环管路。

图纸角落铅笔小字：「每批七席，择心疾执念纯粹者入庄，隐观自然演化。」

中层是第一批记录，扉页贴着七人名签：陆苍（化名疗养者）、林晚、赵启年、孙敏、吴岫、郑怀谨、陈默。三个月闭环，五人出局。留存：林晚、陆苍。

最厚一叠是第二批记录：何既明、罗小山、高兰、叶铮、林晚、你、陆苍。四人出局，剩余三人。

档案最后几页字迹潦草：「闭环成型，数据完备。人性执念无规律，模型无意义。实验终止。」`,note:'三年实验，两批七人闭环。',pickup:'archive',archiveRead:true,completeChapter:'c2'},

  'DRAFT':{name:'草稿残页',jigsaw:{img:'storage',c:3,r:2},
    text:`一叠手写草稿，多处涂改。

「第一年单人、双人试错，声场参数不稳定，情绪传导微弱，数据不可用。」

「第二年四人组实验，情绪扰动提升，但缺少稳定闭环，出局率不可控。」

「假说：寻找一对互补样本——一端持续释放压抑执念，一端完全封闭不向外发散，形成单向传导闭环。」

「祖父手札所言'以声动心'，终究要在活人身上验完。」

你终于明白：三年不止两批七人实验。无数更早来到这里的人，都是前期调试的代价。`,note:'三年梯度试错，不止两批。',pickup:'draft',completeChapter:'c3',unlockControl:true},

  'SPARES':{name:'设备配件',text:`密封袋包装的备用传感器、通风格栅，标签对应地下室房间编号。

旁边是清洁工具——拖把、除尘喷雾，抹布洗得发白。

一年来有人定期回来打扫麓庄。`,note:'有人在空庄之年定期回来。'},

  'LIVING-MIRROR':{name:'铜镜',text:`镜面发乌。你用袖口擦开一角，照见自己身后的客厅——白布、冷灰、停摆的钟。

镜角刻着一行极小的字：「明岚制镜，照声不照影。」

这面镜子比麓庄所有实验都老。`},
  'DINING-ROSTER':{name:'待客名册',text:`历年访客都登记在册。

最早的几页是民国字迹，访客多是学者、医生、避世的文人。

往后翻，名字越来越少，备注越来越短——「静养」「好转」「转送」「未再联系」。

三年前开始，名册上的名字与铁盒档案里的名签一一对应。`},
  'STUDY-SHELF':{name:'空书架',text:`书架空了大半，只剩几本声学杂志与翻烂的建筑规范。

夹层里掉出一张书签，背面写着：

「祖父没验完的，我来验。验不出来，就承认验不出来。」

字迹是陆苍的。`},

  'OLD-PHOTO':{name:'泛黄旧照',text:`橱窗最上层压着一张玻璃底板照片。

一九三四年，麓庄落成。青石台阶上站着长衫青年与一众学者，门楣悬匾：麓庄。

照片背面钢笔题字：「麓庄既成，以待同好。声者，心之回响也。——明岚」

说明卡写着：陆明岚，声学学者，晚年隐居麓庄，研究「声与情志」，未竟而终。

四年前，他的孙辈回到这座荒废老宅。`,note:'麓庄建于一九三四年，陆苍是陆明岚之孙。',pickup:'oldphoto',completeChapter:'c7'},
  'MASTER-LOG':{name:'书桌演算',text:`桌上摊着三份手写记录。

「苏雯，二十六岁，重度失眠，独居二层客房。声场低剂量调试第四十一天，称夜里听见亡母唤她。」

「第六十三天，状态平稳，自述痊愈，坚持下山。」

「半月后其家属来电寻人。此后再无音讯。记录封存，不列入正式批次。」

纸页空白处反复写着同一句话又划掉：「她不算。她不能算。」`,note:'早期试错者苏雯，未被列入任何批次。'},
  'ATTIC-KEY':{name:'阁楼铜钥',text:`老式衣柜里挂着几件洗得发白的衬衫。

上格抽屉中，一把铜钥系着褪色红绳，标签写着「阁楼」。

红绳被摩挲得发毛，像是有人常常拿出来，又一次次放回去。`,pickup:'attickey',setFlag:'atticKey'},
  'CHEM-KEY':{name:'床头柜抽屉',text:`抽屉里只有一把铜钥匙，钥柄刻着一个「药」字。

下压一张便签：「药剂室平日上锁。我怕自己半夜下去。」

他比自己以为的更清楚那间屋子意味着什么。`,pickup:'chemkey',setFlag:'chemKey'},
  'GUEST-NOTE':{name:'二层客房床铺',text:`枕套平整，下面压着一张药房小票。

安眠药，足量，开具日期是苏雯下山前三天。

小票背面写着：「他们说声音是我想出来的。可墙每天夜里都在嗡。」`},
  'BATH-MED':{name:'镜柜',text:`镜柜里整齐摆着未开封的助眠药与镇静剂。

最里层一瓶已经空了，瓶身贴着客房编号。

最早的访客靠这些药熬过夜里的嗡鸣，后来的样本，连药都不再发。`},
  'BATH-TUB':{name:'白瓷浴缸',text:`浴缸干干净净，排水口缠着一小缕长发。

一年来的打扫细致到了这里，却独独漏掉这一缕。

也许是故意留下的。`},
  'MANUSCRIPT':{name:'旧式手稿',jigsaw:{img:'attic',c:3,r:2},
    text:`樟木箱里是陆明岚的全部手札，线装成册，纸色焦黄。

「声能动心，心亦能应声。居静室者，其悲喜可随声场而走，然其志不可夺。」

「故验声之要，首在止：知止，则人为人；不知止，则声为祸。」

最后一册只剩残页，墨笔极重：「余此生未能验，后来者慎之，慎之。」

陆苍读完了祖父用一生写下的「止」字，却用三年去验了那个「祸」字。`,note:'陆明岚手札：核心在「知止」，陆苍恰恰没有停。',pickup:'manuscript',completeChapter:'c8'},
  'ATTIC-GRAMO':{name:'旧留声机',mono:'minglan',closeup:{img:'attic',lines:['针头落下，蜡盘缓缓转动……','一个半世纪前的声音，在阁楼里复苏。']},
    text:`老式留声机，摇柄还在。唱片是一张自制蜡盘。

针头滑过一道旧裂痕，声音反复卡在同一个字上：「止……止……止……」`},

  'WELL-LETTER':{name:'井中瓷盒',jigsaw:{img:'courtyard',c:2,r:2},
    text:`井壁半干。你在井台石缝里摸出一只油纸裹紧的瓷盒。

盒中是林晚的信，字迹清瘦：

「若有人再回麓庄，请替我知道一件事：我留在这里，不是谁的安排。第一批的人接连倒下时，我总以为是我夜里翻身、叹气、哭泣的声音害了大家。」

「后来我才懂，墙里的声音从来不是我。可那时候已经太晚了。」

「我不恨引我入局的人。我只盼后来的人，不必再把别人的罪，认成自己的错。」

信没有抬头，也没有落款。`,note:'林晚未寄之信：她把罪认了很久，最终放下了。',pickup:'linletter',sideC9:true},
  'TREE':{name:'老国槐',text:`老国槐的树皮上刻着一道道浅痕，高度参差。

那是林晚数日子的方式。最后一道刻痕旁边，刻了一个很小的「晚」字。

树下泥土松软，常有人坐。`},
  'GATE':{name:'后山小门',text:`一扇柴门通向山后小径。浓雾里隐约能看见木屋的轮廓。

门闩没有落下——这扇门一年来都为来人开着。

此刻还不必过去。先把麓庄看完。`},

  'CHEM-LOG':{name:'出入库台账',jigsaw:{img:'chem',c:2,r:2},
    text:`台账记录了三年全部药剂出入。

第一年：单人调试，领用七次，备注「参数观察」。
第二年：四人小组，领用二十三次，三行备注被墨涂死。
第三年：两批闭环，按「批次」整箱领用。

最后一页，陆苍的字：

「气溶胶只放大情绪，从不制造情绪。她们心里本没有的东西，我给不了；她们心里本有的，我推到了极致。」

「账记到这里。杀人的不是药，是开药的人。」`,note:'药剂台账：三年领用全记录与陆苍的自供。',sideC9:true},
  'CHEM-CAN':{name:'金属空罐',text:`一只开封过的金属罐，标签批次与过载之夜吻合。

罐底残留着甜腥气味，罐身被人用刀片刻了一道又一道，像在记数。

泄压的那一罐，是从这间屋子搬上机房的。`},

  'CONTROL-LOG':{name:'机房日志',mono:'control',
    text:`连续打印的系统记录，末尾陆苍手写批注：

「第87天。样本稳定。林晚持续自我压抑。自闭样本低活动量。其余四人波动走高。」

「第89天。一名样本急性应激，意外出局。」

「第90天。剩余三人：林晚、自闭样本、本人。闭环完整。」

最后一页，字迹不再工整：

「林晚查阅全部记录。三年所有实验被她知晓。情绪到达峰值，声场过载，药剂管路泄压，无法手动切断。」

「系统反噬超出预估。实验作废。」`,note:'林晚死亡真相：过载之夜，管路泄压。',pickup:'log',completeChapter:'c5'},
  'MANUAL':{name:'应急手册',text:`打印成册的设备手册，红色警示：

「声场过载触发药剂管路泄压。气溶胶不直接致死，但会急剧放大当下情绪——恐惧、愤怒、愧疚。情绪越强，效果越猛烈。」

「一旦触发泄压，无法紧急关停。」

末页有人用钢笔补了一行：「祖父写过止字。我没有读。」`,note:'气溶胶原理：只放大，不制造。',pickup:'manual'},
  'USB-LOAD':{name:'旧电脑',closeup:{img:'control',shake:1,drone:1,pageMs:2600,lines:['监控录像自动播放……','灯光频闪，格栅喷出白雾。','林晚身体僵硬，慢慢倒下。','画面雪花中断。']},
    text:`旧电脑开机。U盘已经插在接口上。

你点开视频文件夹——地下走廊的监控录像。

画面里，林晚与陆苍对峙。灯光频闪，格栅喷出白雾。林晚身体僵硬，慢慢倒下。

随后画面雪花中断。

你打开备忘录文档：

「我留在山中一年，反复回看这些记录。人性本身没有公式。所有记录没有销毁，我寄出信，邀请唯一幸存的见证者回来。」

「我就在山庄后山的小屋，等你。」`,note:'陆苍在后山等你。',pickup:'usb',completeChapter:'c6',finalChoice:true},

  'R1-DESK':{name:'1号房桌面',text:`桌面有几道浅划痕，像有人反复用指甲划出来的。

划痕凑在一起，是一个不断写歪的「回家」。`},
  'R1-MIC':{name:'1号房拾音设备',mini:'simon',text:`天花板角落的黑色拾音头，红灯早已熄灭。

它曾把房间里每一次翻身、每一句梦话都收进机房。

你完成了拾音校准。当年你也在这样的红点之下睡着。`},
  'R1-BED':{name:'1号房单人床',text:`床铺平整，床下空空。

床垫内侧用记号笔写着一个名字：赵启年。

第一批五人之一。他在闭环第七十一天出局，这张床随后换了三次床单。`},

  'R2-NOTE':{name:'撕碎字条',jigsaw:{img:'room2',c:2,r:2},
    text:`撕碎的纸片拼合完整，字迹潦草：

「墙里一直有声音，我控制不住想法。它知道我在想什么。」

「若我没能出去，请告诉外面，不是我疯了，是这间屋子。」

声场系统放大内心情绪，让人感知到不存在的低语。`,note:'2号房：幻听字条。',pickup:'note2'},
  'R2-PIECE':{name:'床底残片',text:`半张纸片与桌面上的字条边缘吻合。

拼到一起后，末尾那句「请告诉外面」终于完整。`},

  'R3-STAIN':{name:'3号房污渍',text:`墙角深色污渍，擦不掉，边缘被反复擦洗过。

台面记录里，第一批孙敏的编号下有一行小字：「情绪应激，碰翻器械。」

污渍留下了，她没有。`},
  'R3-TALLY':{name:'墙面刻线',text:`门后墙面刻满竖线，每七道划一个横。

数到第十一个七天之后，刻线戛然而止，只剩一道孤零零的竖痕。

住在这里的人数完了自己全部的日子。`},
  'R3-VENT':{name:'3号房通风口',text:`通风口格栅松动，内部细管与档案里的药剂循环管路相连。

管口有一圈淡淡的甜腥残痕。

白雾就是从这样的口子，落进每一个深夜。`},

  'R4-DUCT':{name:'4号房管线',mini:'wire',text:`通风口内部裸露细管，对应档案里的药剂循环管路。

管壁贴着编号：吴岫。

你把错位的管线重新接通。有人曾在这根管子上用细线绑了一张纸条，线还在，纸条早被风抽走了。`},
  'R4-HIDE':{name:'松动木板',text:`你掀开翘起的墙裙木板，里面藏着一张叠成方块的纸。

字迹抖得厉害：

「今天又少了一个人。陆先生说这是静养。可静养不会让人再也醒不过来。」

「我把纸藏在这里。若我也没能出去，这就是证据。」

第一批郑怀谨留下的。她最终也没能出去，但证据还在。`,note:'4号房墙裙：郑怀谨藏下的证词。'},

  'R5-CARVE':{name:'桌面刻字',text:`浅浅两个字：「别响」。

刻痕很浅，反复摩挲，几乎快磨平。

林晚给自己戴上的枷锁——她以为只要自己安静，所有人就能活。`},
  'PENCIL':{name:'断铅笔',text:`一截断裂的木质铅笔，笔芯磨损严重。

林晚在留守期间用过的物品。她习惯书写又反复划掉，不敢留下完整情绪记录。

笔身上刻着极小的字：「晚，第七十三天」。`,note:'林晚留守证据。',pickup:'pencil'},
  'R5-BOARD':{name:'床头板内侧',mono:'r5',
    text:`床头板翻过来，内侧密密麻麻全是字，又被逐一划掉。

唯一没划掉的一句在最下面：

「不是我的错。」

三个字写得极轻。她用了一整年，才允许自己写下这句话。`},

  'R6-BED':{name:'你的床',text:`你在床边站定。

记忆里，你整日缩在这张床的最里侧，用被子蒙住头，数自己的心跳。

床垫凹陷还保持着旧形状。`},
  'R6-DESK':{name:'你的木桌',text:`桌面上还留着你用指甲掐出的月牙印。

你从不开口，只在桌上一笔一笔画墙。

画到后来，满桌都是封死的方框。`},
  'R6-WINDOW':{name:'高窗',text:`窗户很高，只能看见一小方灰色的天。

过载那夜，你就是从这扇窗看见走廊灯光疯狂明灭。

白雾漫上来时，你把脸埋进臂弯，一动不动。`},
  'R6-CORNER':{name:'床角',mono:'r6',
    text:`床角的墙面有一块深色人形印子。

那是你一整年靠着墙缩成一团留下的。

身体先于记忆做出反应——胸口发闷，指尖发麻，你本能地蜷起了肩膀。`},

  'R7-BOX':{name:'空金属盒',mini:'dials',text:`带锁铁盒，锁扣弯折撬开，内部空空如也，只剩纸渣。

你转动三位号盘，锁扣弹开。陆苍每轮实验的核心原始记录，被他本人取走了。

他带走了数据，却没带走这间屋子。`},
  'R7-MIC':{name:'大号拾音设备',text:`这台拾音设备比其他房间大一号，镜头正对床头。

7号房是陆苍自己的房间。

他监听所有人，也把自己放在监听之下——至少在形式上，他把自己算进了七席。`},
  'R7-PAGE':{name:'抽屉夹页',text:`抽屉夹缝里卡着一页被折过很多次的纸，是铁盒里缺的那一页：

「实验终止日补记：模型失败的根本原因——我假设执念有固定形状。林晚让我看见，善意与愧疚同样能形成执念，且比怨恨更难预测。」

「人不是样本。这句话我写得太晚。」`,note:'7号房：陆苍遗失的终止日补记。'},

  /* 开锁门 */
  'DOOR-CHEM':{name:'药剂室铁门',key:'chemkey',scene:'chem',
    text:`你把刻着「药」字的铜钥匙插进锁孔，转动。

铁门发出沉闷的金属声，向内打开。`},
  'DOOR-ATTIC':{name:'阁楼小门',key:'attickey',scene:'attic',
    text:`系着褪色红绳的铜钥转动，小门弹开，阁楼的尘埃在光柱里浮动。`},

  'CABIN-TALK':{name:'后山对话',startDialogue:true},
  'FINAL-CHOICE':{name:'最终抉择',startChoice:true},
};

  why_stay:{speaker:'陆苍',text:'逃走没有意义。三年，我改造麓庄，设计声场、气流、缓释药剂，挑选内心有执念的人作为样本。每一轮我都伪装成疗养者混在人群里。\n\n我本以为情绪可以量化，执念可以找到固定规律。最后才发现，人心没有公式。\n\n我留在山里这一年，不是赎罪，只是不甘心。我想知道，这场实验最后的见证者，看完所有残局之后会做出什么选择。',choices:[
    {t:'你期待我做出什么选择？',next:'expect'},{t:'返回主选项',next:'start'}]},
  expect:{speaker:'陆苍',text:'我没有预设答案。你可以下山把一切交给警方，也可以亲自来听完我全部解释。\n\n我不奢求宽恕。我只希望，这场耗费三年的实验，能有一个见证者。',choices:[{t:'返回主选项',next:'start'}]},
  early_test:{speaker:'陆苍',text:'他们是我最不愿提起的部分。第一年单人、双人试错，第二年四人小组。很多人连完整闭环都没有进入。苏雯就住在二层客房，她以为自己痊愈下了山，她的家属半个月后来找过人。\n\n我当时告诉自己，这只是调试设备必要的代价。我低估了人的脆弱。',choices:[

/* ★ 音效与BGM */
let actx=null,bgmNodes=[],bgmInt=null;
function ensureAudio(){if(!actx)actx=new(window.AudioContext||window.webkitAudioContext)();}
function sfx(type){try{
  ensureAudio();const t=actx.currentTime;
  if(type==='click')tone(680,.05,.04,t);
  if(type==='open'){tone(300,.12,.06,t);setTimeout(()=>tone(600,.1,.04),70);}
  if(type==='error')tone(120,.25,.09,t,'sawtooth');
  if(type==='unlock'){tone(500,.1,.07,t);setTimeout(()=>tone(800,.1,.06),90);setTimeout(()=>tone(1200,.13,.05),180);}
  if(type==='pickup'){tone(700,.06,.06,t,'triangle');setTimeout(()=>tone(1050,.08,.05),50);setTimeout(()=>tone(1400,.1,.04),100);}
  if(type==='door'){tone(70,.35,.1,t);setTimeout(()=>tone(55,.25,.07),150);}
}catch(e){}}
function tone(f,d,v,when,type){
  const o=actx.createOscillator(),g=actx.createGain();
  o.type=type||'sine';o.frequency.value=f;o.connect(g);g.connect(actx.destination);
  g.gain.setValueAtTime(v,when||actx.currentTime);
  g.gain.exponentialRampToValueAtTime(.001,(when||actx.currentTime)+d);
  o.start(when);o.stop((when||actx.currentTime)+d);
}
function startBGM(){if(!state.musicOn)return;try{
  ensureAudio();stopBGM();
  [55,82.5,110].forEach((f,i)=>{
    const o=actx.createOscillator(),g=actx.createGain();
    o.type=i===0?'sine':'triangle';o.frequency.value=f;g.gain.value=i===0?.03:.01;
    const l=actx.createOscillator(),lg=actx.createGain();
    l.frequency.value=.04+i*.02;lg.gain.value=.012;l.connect(lg);lg.connect(g.gain);
    o.connect(g);g.connect(actx.destination);o.start();l.start();bgmNodes.push(o,l);
  });
  bgmInt=setInterval(()=>{if(state.musicOn)tone([220,261.6,293.7,329.6,392][Math.floor(Math.random()*5)],2.5,.012);},7000);
}catch(e){}}
function stopBGM(){bgmNodes.forEach(n=>{try{n.stop()}catch(e){}});bgmNodes=[];if(bgmInt){clearInterval(bgmInt);bgmInt=null;}}
function toggleMusic(){
  state.musicOn=!state.musicOn;
  document.getElementById('btn-music').classList.toggle('active',state.musicOn);
  if(state.musicOn){startBGM();sfx('open');}else{stopBGM();sfx('click');}
}

/* ★★★ 语音引擎（参数全部可调）★★★ */
let VOICE_LIST=[];
function refreshVoices(){try{VOICE_LIST=speechSynthesis.getVoices();}catch(e){}}
function zhVoices(){return VOICE_LIST.filter(v=>v.lang.toLowerCase().startsWith('zh'));}
function pickVoice(){
  const uri=state.cv.voiceURI;
  if(uri&&uri!=='auto'){const f=VOICE_LIST.find(v=>v.voiceURI===uri);if(f)return f;}
  const maleKw=['yunjian','yunxi','yunyang','yunze','yunhao','yunfeng','kangkang','dingzhen','male','kang','志强','云健','云希','云扬','云泽','云浩'];
  const femaleKw=['xiaoxiao','xiaoyi','xiaomei','xiaohan','huihui','yaoyao','female','woman','girl','晓','筱','慧','瑶','婷','妹','玲','女'];
  let best=null,bs=-99;
  zhVoices().forEach(v=>{
    const n=v.name.toLowerCase();let s=0;
    maleKw.forEach(k=>{if(n.includes(k.toLowerCase()))s+=3;});
    femaleKw.forEach(k=>{if(n.includes(k.toLowerCase()))s-=4;});
    if(s>bs){bs=s;best=v;}
  });
  return best;
}
function speak(text){
  if(!state||state.voiceOn===false)return;
  if(!('speechSynthesis' in window))return;
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);
  u.lang='zh-CN';u.rate=state.cv.rate;u.pitch=state.cv.pitch;
  const v=pickVoice();if(v)u.voice=v;
  speechSynthesis.speak(u);
}
function stopSpeak(){if('speechSynthesis' in window)speechSynthesis.cancel();}

function floorOfScene(scene){

/* ★ 动作分发 */
const EP_BY={ARCHIVE:'cv_archive',DRAFT:'cv_draft','CONTROL-LOG':'cv_overload',MANUSCRIPT:'cv_oldhouse'};
function doAction(action){
  const f=FILES[action];if(!f){console.log('unknown',action);return;}
  if(f.startDialogue){startDialogue('start');return;}
  if(f.startChoice){showFinalChoice();return;}
  if(f.lock){openLock(f.scene);return;}
  if(f.key){
    if(!state.owned.includes(f.key)){sfx('error');showDialog('门上着锁，需要对应的钥匙。','提示');return;}
    sfx('door');showDialog(f.text,f.name);
    setTimeout(()=>loadScene(f.scene),700);return;
  }
  const read=state.read.includes(action);
  const chain=[];
  if(f.closeup)chain.push(cb=>closeUp(f.closeup.img,f.closeup.lines,f.closeup,cb));
  if(f.mini&&!read){const map={simon:openSimon,dials:openDials,wire:openWire};
    chain.push(cb=>map[f.mini](f.name,cb));}
  if(f.jigsaw&&!read)chain.push(cb=>openJigsaw(f.jigsaw.img,f.jigsaw.c,f.jigsaw.r,f.name,cb));
  chain.push(cb=>{reveal(action);cb&&cb();});
  let i=0;(function next(){if(i>=chain.length)return;const fn=chain[i++];fn(next);})();
}
function reveal(action){
  const f=FILES[action];
  monoQ=null;
  sfx('open');showDialog(f.text,f.name);
  if(f.note)addNote(f.note);
  if(f.archiveRead){state.flags.archiveRead=true;state.flags.basementOpen=true;showToast('✦ 地下室开放');}
  if(f.setFlag)state.flags[f.setFlag]=true;
  if(f.unlockControl)state.flags.controlOpen=true;
  if(f.finalChoice){state.flags.finalChoice=true;completeChapter('c10');}
  if(f.completeChapter)completeChapter(f.completeChapter);
  if(f.sideC9){if(action==='CHEM-LOG')state.flags.chemRead=true;
    if(state.flags.chemRead&&state.owned.includes('linletter'))completeChapter('c9');}
  if(!state.read.includes(action))state.read.push(action);
  unlockTimeBy(action);checkRoomDone(action);
  if(f.pickup)pickupItem(f.pickup);
  if(f.mono)setTimeout(()=>playMono(f.mono),500);
  if(EP_BY[action])setTimeout(()=>playEpisode(EP_BY[action]),200);
}
function checkRoomDone(action){
  Object.entries(ROOM_TASKS).forEach(([room,tasks])=>{
    if(!tasks.includes(action)||state.roomDone[room])return;
    if(tasks.every(t=>state.read.includes(t))){
      state.roomDone[room]=true;
      const n=room.replace('room','');showToast('✦ '+n+'号房调查完毕');
      const all=Object.keys(ROOM_TASKS).every(r=>state.roomDone[r]);
      const c=state.chapters.find(x=>x.id==='c4');
      if(all){c.text='搜查地下室七间样本房（7/7）';completeChapter('c4');}
      else{c.text='搜查地下室七间样本房（'+Object.keys(state.roomDone).length+'/7）';renderTasks();}
    }
  });
}
function unlockTimeBy(action){
  TIMELINE.forEach(t=>{if(t.by===action&&!state.unlockedTime.includes(t.id)){
    state.unlockedTime.push(t.id);showToast('✦ 时间回响解锁：'+t.n);}});
  renderTimeline();
}

/* ★★ 拼图 v12：底图/预览/重置/完成解锁 ★★ */
let jig2API=null;
function openJigsaw(imgKey,c,r,title,onDone){
  const TW=600,TH=Math.round(TW*9/16),pw=TW/c,ph=TH/r;
  const url=resolveImg(imgKey);
  let cells='';
  for(let i=0;i<c*r;i++)
    cells+='<div class="jig2-cell" data-idx="'+i+'" style="width:'+pw+'px;height:'+ph+'px"></div>';
  openPanel(
    '<h3>'+title+' · 拼合记忆碎片</h3><div class="jig2-wrap">'+
    '<div class="jig2-target" id="jig2-target" style="grid-template-columns:repeat('+c+','+pw+'px)">'+cells+'</div>'+
    '<div class="jig2-tray" id="jig2-tray"></div>'+
    '<div class="jig2-tools">'+
      '<button onclick="jig2API.preview()">预览原图</button>'+
      '<label style="display:flex;align-items:center;gap:4px"><input type="checkbox" checked onchange="jig2API.ghost(this.checked)">显示底图</label>'+
      '<button onclick="jig2API.reset()">重置</button>'+
      '<span class="prog" id="jig2-prog">进度 0/'+(c*r)+'</span>'+
    '</div></div>'+
    '<div id="jig2-preview"><img src="'+url+'"></div>',true);
  document.getElementById('jig2-preview').onclick=function(){this.style.display='none';};
  let placed=0;
  function setProg(){document.getElementById('jig2-prog').textContent='进度 '+placed+'/'+(c*r);}
  function shuffle(){
    const tray=document.getElementById('jig2-tray');
    tray.innerHTML='';
    const order=[...Array(c*r).keys()].sort(()=>Math.random()-0.5);
    const tw=tray.clientWidth- pw-8,th=tray.clientHeight-ph-8;
    order.forEach(idx=>{
      const cc=idx%c,rr=Math.floor(idx/c);
      const p=document.createElement('div');
      p.className='jig2-piece';p.setAttribute('data-idx',idx);
      const tx=6+Math.random()*Math.max(tw,6),ty=6+Math.random()*Math.max(th,6);
      p.style.left=tx+'px';p.style.top=ty+'px';
      p.style.width=pw+'px';p.style.height=ph+'px';
      p.style.backgroundImage='url('+url+')';
      p.style.backgroundSize=TW+'px '+TH+'px';
      p.style.backgroundPosition='-'+cc*pw+'px -'+rr*ph+'px';
      p.home={left:tx,top:ty};
      tray.appendChild(p);
      bindPiece(p);
    });
  }
  function bindPiece(p){
    let fix=false,ox=0,oy=0;
    p.onpointerdown=e=>{
      if(p.classList.contains('snapped'))return;
      fix=true;p.classList.add('dragging');p.setPointerCapture(e.pointerId);
      const r=p.getBoundingClientRect();ox=e.clientX-r.left;oy=e.clientY-r.top;
      p.style.position='fixed';p.style.left=(e.clientX-ox)+'px';p.style.top=(e.clientY-oy)+'px';
    };
    p.onpointermove=e=>{if(!fix)return;p.style.left=(e.clientX-ox)+'px';p.style.top=(e.clientY-oy)+'px';};
    p.onpointerup=e=>{
      if(!fix)return;fix=false;p.classList.remove('dragging');
      p.style.pointerEvents='none';
      const el=document.elementFromPoint(e.clientX,e.clientY);
      p.style.pointerEvents='';
      const cell=el?el.closest('.jig2-cell'):null;
      if(cell&&cell.getAttribute('data-idx')===p.getAttribute('data-idx')&&!cell.classList.contains('filled')){
        cell.classList.add('filled');
        p.classList.add('snapped');p.style.position='absolute';
        cell.appendChild(p);placed++;setProg();sfx('unlock');
        if(placed===c*r)finish();
      }else{
        p.style.transition='left .18s,top .18s';
        p.style.position='absolute';
        p.style.left=p.home.left+'px';p.style.top=p.home.top+'px';
        setTimeout(()=>p.style.transition='',200);
      }
    };
  }
  function ghost(on){
    document.querySelectorAll('.jig2-cell').forEach(cell=>{
      const idx=+cell.getAttribute('data-idx'),cc=idx%c,rr=Math.floor(idx/c);
      cell.classList.toggle('ghost',on);
      if(on){const a=cell.querySelector('::after');
        cell.style.setProperty('--bg','url('+url+')');
        cell.style.backgroundImage='url('+url+')';
        cell.style.backgroundSize=TW+'px '+TH+'px';
        cell.style.backgroundPosition='-'+cc*pw+'px -'+rr*ph+'px';
        cell.style.opacity='0.22';
      }else{cell.style.backgroundImage='';cell.style.opacity='1';}
    });
  }
  function finish(){
    setTimeout(()=>{
      openPanel('<div class="jig-done"><h3>记 忆 拼 合</h3>'+
        '<img src="'+url+'"><div class="unlock-t">✦ 线索解锁：'+title+'</div>'+
        '<button class="pick-go" onclick="closePanel();jig2API.done()">继 续</button></div>',true);
    },400);
  }
  jig2API={
    preview(){document.getElementById('jig2-preview').style.display='flex';},
    ghost,reset(){placed=0;setProg();
      document.querySelectorAll('.jig2-cell').forEach(x=>x.classList.remove('filled'));
      shuffle();sfx('click');},
    done(){onDone();},
  };
  shuffle();ghost(true);
}

function openLock(scene){
  const tg=[25+Math.random()*20,50+Math.random()*15,72+Math.random()*15];

    tg.map((t,i)=>'<div class="tumbler"><div class="tl"><span>锁舌 '+(i+1)+'</span><span id="tv'+i+'">--</span></div>'+
      '<input type="range" min="0" max="100" value="50" oninput="tumCheck(this,'+i+','+t.toFixed(1)+')"></div>').join('')+
    '<button class="lock-go" id="lock-go" disabled>转 动 钥 匙</button></div>');
  const st=[false,false,false];
  window.tumCheck=function(el,i,t){
    const v=+el.value;
    document.getElementById('tv'+i).textContent=v;

    sfx('unlock');closePanel();
    if(scene==='chem'&&!state.visited.includes('chem')){}
    loadScene(scene);
  };
}

function floorSVG(fkey){
  const f=MAP2[fkey],w=f.vb[0],h=f.vb[1];
  let defs='',bodies='',labs='';
  f.polys.forEach((p,i)=>{
    const pts=P(p.pts),cx=p.pts.reduce((a,b)=>a+b[0],0)/p.pts.length,
      cy=p.pts.reduce((a,b)=>a+b[1],0)/p.pts.length;
    const xs=p.pts.map(q=>q[0]),ys=p.pts.map(q=>q[1]);
    const bx=Math.min(...xs),by=Math.min(...ys),bw=Math.max(...xs)-bx,bh=Math.max(...ys)-by;
    if(p.room){
      defs+='<clipPath id="cp'+fkey+i+'"><polygon points="'+pts+'"/></clipPath>';
      bodies+='<image clip-path="url(#cp'+fkey+i+')" preserveAspectRatio="xMidYMid slice" x="'+bx+'" y="'+by+'" width="'+bw+'" height="'+bh+'" href="'+SCENE_BG[p.room]+'"/>';
    }
    const ok=p.room?roomAccess(p.room):true;
    const here=p.room&&state.scene===p.room;
    const at=p.room?' onclick="mapGo(\''+p.room+'\','+ok+')" style="cursor:'+(ok?'pointer':'not-allowed')+'"':'';
    bodies+='<polygon points="'+pts+'" fill="'+(p.cor?'rgba(168,134,58,0.14)':p.ext?'rgba(62,112,104,0.06)':'none')+'" stroke="'+(here?'#274a45':'#6e5a24')+'" stroke-width="'+(here?3:1.6)+'"'+(p.cor||p.ext?' stroke-dasharray="5 4"':'')+at+'/>';
    if(p.room&&!ok)bodies+='<polygon points="'+pts+'" fill="rgba(36,30,18,0.62)"/>';
    if(here)bodies+='<polygon points="'+pts+'" fill="rgba(62,112,104,0.16)"/>';
    labs+='<text x="'+cx+'" y="'+cy+'" class="rn" style="font-size:11px;paint-order:stroke;stroke:#f6efdd;stroke-width:3px">'+(p.room&&!ok?'？？？':p.n)+'</text>';
  });
  return'<svg class="floor-svg" viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="xMidYMid meet"><defs>'+defs+'</defs>'+bodies+labs+'</svg>';
}

let zs=null;
function openZoom(fkey){
  const wrap=document.getElementById('zoom-wrap');
  wrap.innerHTML=floorSVG(fkey);zs={s:1,dx:0,dy:0};applyZoom();
  document.getElementById('map-zoom').style.display='block';
  let sx=0,sy=0,mv=0,dr=false;
  wrap.onpointerdown=e=>{dr=true;mv=0;sx=e.clientX-zs.dx;sy=e.clientY-zs.dy;
    wrap.classList.add('dragging');wrap.setPointerCapture(e.pointerId);};
  wrap.onpointermove=e=>{if(!dr)return;zs.dx=e.clientX-sx;zs.dy=e.clientY-sy;
    mv+=Math.abs(e.movementX)+Math.abs(e.movementY);applyZoom();};
  wrap.onpointerup=e=>{dr=false;wrap.classList.remove('dragging');
    if(mv<6){const g=e.target.closest('.rm');if(g){const rm=g.getAttribute('class');
      const room=g.outerHTML.match(/mapGo\('([^']+)'/);
      if(room)mapGo(room[1],!g.classList.contains('locked'));}}};
  wrap.onwheel=e=>{e.preventDefault();zs.s=Math.min(3,Math.max(.5,zs.s-e.deltaY*.0012));applyZoom();};
}

/* 1. Simon 音序（校准拾音设备） */
function openSimon(title,onDone){
  const freqs=[330,440,550,660],seqLen=4;
  openPanel('<h3>'+title+' · 校准拾音设备</h3><div class="simon-box">'+
    '<div class="simon-pads">'+
      ['#c8a850','#3e7068','#b97a86','#6e5a24'].map((c,i)=>
        '<div class="simon-pad" data-i="'+i+'" style="background:'+c+'"></div>').join('')+
    '</div><button class="simon-go" id="simon-go">开 始 校 准</button>'+
    '<div class="simon-info" id="simon-info">观察灯序与音序，然后按同样顺序点击</div></div>');
  const pads=[...document.querySelectorAll('.simon-pad')];
  let seq=[],inp=[],busy=true;
  function beep(i,d){tone(freqs[i],d||.4,.08);}
  function lit(i){pads[i].classList.add('lit');beep(i);
    setTimeout(()=>pads[i].classList.remove('lit'),380);}
  function genSeq(){seq=[];for(let i=0;i<seqLen;i++)seq.push(Math.floor(Math.random()*4));}
  async function playSeq(){
    busy=true;document.getElementById('simon-info').textContent='注意观察……';
    await new Promise(r=>setTimeout(r,500));
    for(const i of seq){lit(i);await new Promise(r=>setTimeout(r,620));}
    busy=false;inp=[];document.getElementById('simon-info').textContent='请按顺序点击';
  }
  pads.forEach(p=>p.onclick=()=>{
    if(busy)return;const i=+p.getAttribute('data-i');lit(i);
    if(i===seq[inp.length]){inp.push(i);
      if(inp.length===seq.length){
        busy=true;document.getElementById('simon-info').textContent='✦ 校准成功';
        sfx('unlock');setTimeout(()=>{closePanel();onDone();},700);}
    }else{
      sfx('error');document.getElementById('simon-info').textContent='顺序错误，重新观察';
      setTimeout(playSeq,700);
    }
  });
  document.getElementById('simon-go').onclick=function(){genSeq();playSeq();
    this.style.display='none';};
}

/* 2. 数字转盘（撬开的铁盒） */
function openDials(title,onDone){
  const target=[8,9,0];
  openPanel('<h3>'+title+' · 三位数字锁</h3>'+
    '<div style="font-size:10px;color:var(--ink-soft);font-family:Noto Sans SC;text-align:center">盒底刻着：「校准第 ?、?、? 天」——数字与机房日志的天数有关（点击圆盘左右两侧 / 拖拽 / 滚轮均可转动）</div>'+
    '<div class="dial-box">'+[0,1,2].map(i=>
      '<div class="dial"><div class="wheel" id="wheel'+i+'" data-i="'+i+'">0</div>'+
      '<button onclick="dialStep('+i+',1)">▲</button> <button onclick="dialStep('+i+',-1)">▼</button></div>').join('')+
    '</div><button class="dial-go" id="dial-go" disabled>转 动 号 盘</button>');
  const vals=[0,0,0];
  window.dialStep=function(i,d){
    vals[i]=(vals[i]+d+10)%10;
    const w=document.getElementById('wheel'+i);
    w.textContent=vals[i];
    w.style.transform='scale(0.92)';setTimeout(()=>w.style.transform='',110);
    tone(400+vals[i]*40,.07,.04);
    document.getElementById('dial-go').disabled=vals.some((v,k)=>v!==target[k]);
  };
  /* 圆盘：点击左半 -1 / 右半 +1；滚轮；横向拖拽 */
  document.querySelectorAll('.wheel').forEach(w=>{
    const i=+w.getAttribute('data-i');
    w.addEventListener('click',e=>{
      const r=w.getBoundingClientRect();
      dialStep(i,e.clientX-r.left>r.width/2?1:-1);
    });
    w.addEventListener('wheel',e=>{e.preventDefault();dialStep(i,e.deltaY<0?1:-1);},{passive:false});
    let sx=0,dr=false;
    w.addEventListener('pointerdown',e=>{dr=true;sx=e.clientX;w.setPointerCapture(e.pointerId);});
    w.addEventListener('pointermove',e=>{if(!dr)return;
      if(Math.abs(e.clientX-sx)>22){dialStep(i,e.clientX>sx?1:-1);sx=e.clientX;}});
    w.addEventListener('pointerup',()=>dr=false);
  });
  document.getElementById('dial-go').onclick=function(){
    sfx('unlock');closePanel();onDone();};
}

/* 3. 接线配对（接通通风管线） */
function openWire(title,onDone){
  const syms=['❦','✿','☾','✦'];
  const L=syms.map((s,i)=>({s,x:60,y:50+i*55})),
        R=syms.slice().sort(()=>Math.random()-0.5).map((s,i)=>({s,x:280,y:50+i*55}));
  openPanel('<h3>'+title+' · 接通通风管线</h3><div class="wire-box">'+
    '<svg class="wire-svg" viewBox="0 0 340 270">'+
    '<g id="wire-lines"></g>'+
    L.map(n=>'<circle class="wire-node" data-s="'+n.s+'" cx="'+n.x+'" cy="'+n.y+'" r="15"/><text class="wire-lab" x="'+n.x+'" y="'+(n.y+4)+'">'+n.s+'</text>').join('')+
    R.map(n=>'<circle class="wire-node" data-s="'+n.s+'" cx="'+n.x+'" cy="'+n.y+'" r="15"/><text class="wire-lab" x="'+n.x+'" y="'+(n.y+4)+'">'+n.s+'</text>').join('')+
    '</svg><div class="simon-info" style="text-align:center">依次点击两侧相同符号，把管线接通</div></div>');
  let sel=null,done=0;
  document.querySelectorAll('.wire-node').forEach(n=>{
    n.onclick=function(){
      if(n.classList.contains('done'))return;
      tone(500,.08,.05);
      if(!sel){sel=n;n.classList.add('sel');return;}
      if(sel===n){n.classList.remove('sel');sel=null;return;}
      if(sel.getAttribute('data-s')===n.getAttribute('data-s')){
        const a=sel,b=n;
        const ar=a.getBoundingClientRect(),br=b.getBoundingClientRect(),
          svg=document.querySelector('.wire-svg').getBoundingClientRect();
        const p=document.createElementNS('http://www.w3.org/2000/svg','path');
        const x1=ar.left-svg.left+ar.width/2,y1=ar.top-svg.top+ar.height/2,
              x2=br.left-svg.left+br.width/2,y2=br.top-svg.top+br.height/2;
        p.setAttribute('d','M'+x1+' '+y1+' C'+(x1+60)+' '+y1+' '+(x2-60)+' '+y2+' '+x2+' '+y2);
        p.setAttribute('class','wire-path');
        document.getElementById('wire-lines').appendChild(p);
        a.classList.remove('sel');a.classList.add('done');b.classList.add('done');
        sel=null;done++;sfx('pickup');
        if(done===4){setTimeout(()=>{closePanel();onDone();},500);}
      }else{sfx('error');sel.classList.remove('sel');sel=null;}
    };
  });
}

function closeUp(img,lines,opts,cb){
  opts=opts||{};
  const el=document.getElementById('closeup');

  el.querySelector('.cu-txt').textContent='';

  if(opts.drone){tone(48,4,.09,'sawtooth');tone(51,4,.07,'sawtooth');}
  let i=0;const tx=el.querySelector('.cu-txt');
  const t=setInterval(()=>{tx.textContent=lines[i]||'';
    if(lines[i])speak(lines[i]);i++;
    if(i>lines.length){clearInterval(t);
      setTimeout(()=>{if(el.style.display==='block'){closeUpEnd();cb&&cb();}},opts.pageMs||2600);}
  },opts.pageMs||3200);
  el._t=t;el._cb=cb;
}
